<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg-SBI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#991b1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ring-SBI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-SBI">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer decorative ring -->
  <circle cx="150" cy="150" r="145" fill="url(#ring-SBI)" stroke="#cbd5e0" stroke-width="0.5"/>
  <circle cx="150" cy="150" r="138" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <circle cx="150" cy="150" r="133" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.3"/>

  <!-- Main badge body -->
  <circle cx="150" cy="145" r="125" fill="url(#bg-SBI)" filter="url(#shadow-SBI)"/>

  <!-- Inner decorative circle -->
  <circle cx="150" cy="140" r="88" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Specialization abbreviation -->
  <text x="150" y="115" text-anchor="middle" dominant-baseline="middle"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800"
        font-size="44" fill="#ffffff" letter-spacing="3">SBI</text>

  <!-- Decorative dot -->
  <circle cx="150" cy="145" r="5" fill="rgba(255,255,255,0.15)"/>

  <!-- Category separator line -->
  <rect x="65" y="158" width="170" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Full specialization name -->
  <text x="150" y="186" text-anchor="middle" dominant-baseline="middle"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600"
        font-size="9" fill="rgba(255,255,255,0.9)">Specjalista ds. Bezpieczeństwa Informacji</text>

  <!-- ProCertum badge -->
  <rect x="70" y="212" width="160" height="28" rx="14" fill="rgba(0,0,0,0.35)"/>
  <text x="150" y="226" text-anchor="middle" dominant-baseline="middle"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700"
        font-size="12" fill="#e2e8f0" letter-spacing="2.5">PROCERTUM</text>

  <!-- Bottom accent dots -->
  <circle cx="110" cy="270" r="2.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="130" cy="270" r="2.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="150" cy="270" r="2.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="170" cy="270" r="2.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="190" cy="270" r="2.5" fill="rgba(255,255,255,0.25)"/>
</svg>
